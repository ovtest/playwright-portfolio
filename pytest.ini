[pytest]
# Folder where pytest looks for tests
testpaths = tests
# Lets tests import config.py and the pages package from the project root
pythonpath = .

# Options added to every run:
#   --base-url   the site under test, so tests can just do page.goto("/")
#   (browser: not set here, so it defaults to chromium and can be chosen on
#    the command line, e.g. --browser firefox. Setting it here would ADD
#    chromium to every run, because --browser can be given several times.)
#   --screenshot / --video / --tracing  keep evidence only when a test fails
#   --html       produce a readable HTML report in the reports folder
addopts =
    --base-url=https://www.saucedemo.com
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --html=reports/report.html
    --self-contained-html

# Custom tags used to group tests, e.g. run only smoke tests: pytest -m smoke
markers =
    smoke: quick, critical-path checks
    regression: wider coverage
